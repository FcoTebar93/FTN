services:
  postgres:
    image: postgres:15-alpine
    container_name: ftn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ftn
    ports:
      - "5435:5435"
    volumes:
      - ftn_pgdata:/var/lib/postgresql/data
    networks:
      - ftn-net

  redis:
    image: redis:7-alpine
    container_name: ftn-redis
    ports:
      - "6379:6379"
    networks:
      - ftn-net

  backend:
    container_name: ftn-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # Sobrescribe DATABASE_URL para que el backend vea el contenedor postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ftn
      REDIS_URL: redis://redis:6379
      PORT: 4000
      FTN_TRUST_PROXY: "true"
    depends_on:
      - postgres
      - redis
    ports:
      # Acceso directo al API (opcional); la entrada recomendada es Kong :8000
      - "4000:4000"
    networks:
      - ftn-net

  kong:
    image: kong:3.6
    container_name: ftn-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - backend
    networks:
      - ftn-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: ftn-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
      - kong
    ports:
      - "5173:80"
    networks:
      - ftn-net

networks:
  ftn-net:

volumes:
  ftn_pgdata: